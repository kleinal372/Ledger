<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Ledger — Money Manager</title>
<meta name="theme-color" content="#E9ECF1" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  :root {
    --bg: #E9ECF1; --surface: #FFFFFF; --surface2: #F2F4F7; --border: #E1E4EA;
    --text: #171A21; --muted: #7C8493; --income: #1BAF7C; --expense: #E5585F;
    --gold: #334CFF; --transfer: #6E93B3; --darkcard: #181D26;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  #app { min-height: 100vh; max-width: 640px; margin: 0 auto; position: relative; }
  ::-webkit-scrollbar { height: 6px; width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  button { cursor: pointer; border: none; font-family: var(--font-body); }
  button:active { transform: scale(0.98); }
  input, select { font-family: var(--font-body); background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 9px 10px; color: var(--text); font-size: 13px; box-sizing: border-box; }
  input:focus, select:focus { outline: 1px solid var(--gold); }
  .row:hover { background: var(--surface2); }
  .tab:hover { color: var(--text) !important; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 500; }
  .empty { padding: 22px 8px; color: var(--muted); font-size: 13px; text-align: center; border: 1px dashed var(--border); border-radius: 8px; margin-top: 12px; }
  .btn-gold { background: var(--gold); color: #FFFFFF; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 8px; font-size: 11px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 100%; max-width: 380px; max-height: 85vh; overflow-y: auto; }
  .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

// ---------------- constants ----------------
var CURRENCIES = [
  { code: "INR", symbol: "\u20B9" }, { code: "USD", symbol: "$" }, { code: "EUR", symbol: "\u20AC" },
  { code: "GBP", symbol: "\u00A3" }, { code: "JPY", symbol: "\u00A5" }, { code: "AUD", symbol: "A$" },
];
var EXPENSE_CATEGORIES = ["Food", "Transport", "Housing", "Utilities", "Entertainment", "Health", "Shopping", "Education", "Other"];
var INCOME_CATEGORIES = ["Salary", "Freelance", "Investment", "Gift", "Other"];
var CATEGORY_COLOR = {
  Food: "#C97064", Transport: "#6E93B3", Housing: "#C9A464", Utilities: "#8AA6A3",
  Entertainment: "#A188B0", Health: "#5FAE8A", Shopping: "#B58A5E", Education: "#7CA0C7",
  Other: "#8A8F98", Salary: "#5FAE8A", Freelance: "#6E93B3", Investment: "#C9A464", Gift: "#A188B0",
};
var FALLBACK_PALETTE = ["#8AA6A3", "#B58A5E", "#A188B0", "#7CA0C7", "#9C8563", "#7C9473", "#B07A9E", "#6FA3A0", "#A99B6E"];
var ACCOUNT_TYPES = ["Bank", "Cash", "Card", "Wallet", "Other"];
var STORAGE_KEY = "ledger-money-manager-data";
var NAV = [
  { id: "dashboard", label: "Overview" }, { id: "transactions", label: "Ledger" },
  { id: "analytics", label: "Analytics" }, { id: "budgets", label: "Budgets" },
  { id: "goals", label: "Goals" }, { id: "recurring", label: "Recurring" },
  { id: "accounts", label: "Accounts" }, { id: "reports", label: "Reports" },
  { id: "settings", label: "Settings" },
];

// ---------------- helpers ----------------
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function monthKey(d) { var dt = new Date(d); return dt.getFullYear() + "-" + dt.getMonth(); }
function fmtDate(d) { var dt = new Date(d); return dt.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" }); }
function esc(s) {
  if (s == null) return "";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function categoryColor(cat) {
  if (CATEGORY_COLOR[cat]) return CATEGORY_COLOR[cat];
  var hash = 0;
  for (var i = 0; i < cat.length; i++) hash = (hash * 31 + cat.charCodeAt(i)) >>> 0;
  return FALLBACK_PALETTE[hash % FALLBACK_PALETTE.length];
}
function goalReminder(g) {
  if (!g.deadline || g.saved >= g.target) return null;
  var daysLeft = Math.ceil((new Date(g.deadline) - new Date()) / 86400000);
  if (daysLeft < 0) return { level: "overdue", label: "Overdue by " + Math.abs(daysLeft) + "d" };
  if (daysLeft <= 14) return { level: "due", label: daysLeft === 0 ? "Due today" : "Due in " + daysLeft + "d" };
  return null;
}

var DEFAULT_DATA = {
  accounts: [{ id: uid(), name: "Cash", type: "Cash", initialBalance: 0 }],
  transactions: [], budgets: [], goals: [], recurringTemplates: [],
  settings: { currency: "INR", autoBackupDays: 7, lastBackupAt: null },
  customCategories: { expense: [], income: [] },
};

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (!parsed.customCategories) parsed.customCategories = { expense: [], income: [] };
      if (!parsed.recurringTemplates) parsed.recurringTemplates = [];
      if (!parsed.settings) parsed.settings = { currency: "INR" };
      if (parsed.settings.autoBackupDays === undefined) parsed.settings.autoBackupDays = 7;
      if (parsed.settings.lastBackupAt === undefined) parsed.settings.lastBackupAt = null;
      return parsed;
    }
  } catch (e) {}
  return DEFAULT_DATA;
}
function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }

// ---------------- state ----------------
var data = loadData();
var ui = {
  tab: "dashboard",
  txFilter: { type: "all", account: "all", search: "", range: "all", from: "", to: "" },
  dashboardMonth: monthKey(new Date()),
  modal: null,
  moreOpen: false,
  confirmReset: false,
};

function getExpenseCats() { return EXPENSE_CATEGORIES.concat((data.customCategories && data.customCategories.expense) || []); }
function getIncomeCats() { return INCOME_CATEGORIES.concat((data.customCategories && data.customCategories.income) || []); }

function currency() { return CURRENCIES.filter(function (c) { return c.code === data.settings.currency; })[0] || CURRENCIES[0]; }
function fmt(n) {
  var cur = currency();
  var sign = n < 0 ? "-" : "";
  return sign + cur.symbol + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function balanceOf(accId) {
  var acc = data.accounts.filter(function (a) { return a.id === accId; })[0];
  if (!acc) return 0;
  var bal = acc.initialBalance;
  data.transactions.forEach(function (t) {
    if (t.type === "income" && t.accountId === accId) bal += t.amount;
    else if (t.type === "expense" && t.accountId === accId) bal -= t.amount;
    else if (t.type === "transfer") {
      if (t.accountId === accId) bal -= t.amount;
      if (t.toAccountId === accId) bal += t.amount;
    }
  });
  return bal;
}

// ---------------- render root ----------------
function render() {
  var active = document.activeElement;
  var activeId = active && active.id;
  var selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  var selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  document.getElementById("app").innerHTML = renderApp();

  if (activeId) {
    var el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderApp() {
  var html = "";
  html += '<div style="padding-bottom:78px;">';
  if (ui.tab === "dashboard") html += renderDashboard();
  else if (ui.tab === "transactions") html += '<div style="padding:16px;">' + renderTransactions() + '</div>';
  else if (ui.tab === "analytics") html += '<div style="padding:16px;">' + renderAnalytics() + '</div>';
  else if (ui.tab === "budgets") html += '<div style="padding:16px;">' + renderBudgets() + '</div>';
  else if (ui.tab === "goals") html += '<div style="padding:16px;">' + renderGoals() + '</div>';
  else if (ui.tab === "recurring") html += '<div style="padding:16px;">' + renderRecurring() + '</div>';
  else if (ui.tab === "accounts") html += '<div style="padding:16px;">' + renderAccounts() + '</div>';
  else if (ui.tab === "reports") html += '<div style="padding:16px;">' + renderReports() + '</div>';
  else if (ui.tab === "settings") html += '<div style="padding:16px;">' + renderSettings() + '</div>';
  html += '</div>';

  html += renderBottomNav();
  if (ui.moreOpen) html += renderMoreSheet();
  if (ui.modal) html += renderModal();

  return html;
}

function navItem(id, icon, label, active) {
  return '<button onclick="setTab(\'' + id + '\')" style="background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:' + (active ? "var(--gold)" : "var(--muted)") + ';font-weight:' + (active ? "700" : "500") + ';padding:6px 10px;">' +
    '<span style="font-size:18px;line-height:1;">' + icon + '</span><span>' + label + '</span></button>';
}
function renderBottomNav() {
  var moreGroup = ["analytics", "budgets", "recurring", "accounts", "reports", "settings"];
  var moreActive = moreGroup.indexOf(ui.tab) !== -1;
  var html = '<div style="position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;height:66px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:20;">';
  html += navItem("dashboard", "\u2302", "Home", ui.tab === "dashboard");
  html += navItem("transactions", "\u2637", "Ledger", ui.tab === "transactions");
  html += '<button onclick="openTransactionModal()" style="width:48px;height:48px;border-radius:50%;background:var(--gold);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin-top:-28px;border:5px solid var(--surface);box-shadow:0 4px 10px rgba(51,76,255,0.35);">+</button>';
  html += navItem("goals", "\u25CE", "Goals", ui.tab === "goals");
  html += '<button onclick="toggleMore()" style="background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:' + (moreActive ? "var(--gold)" : "var(--muted)") + ';font-weight:' + (moreActive ? "700" : "500") + ';padding:6px 10px;"><span style="font-size:18px;line-height:1;">\u2630</span><span>More</span></button>';
  html += '</div>';
  return html;
}
function renderMoreSheet() {
  var items = [["analytics", "Analytics"], ["budgets", "Budgets"], ["recurring", "Recurring"], ["accounts", "Accounts"], ["reports", "Reports"], ["settings", "Settings"]];
  var html = '<div style="position:fixed;inset:0;background:rgba(15,17,23,0.45);z-index:30;display:flex;align-items:flex-end;justify-content:center;" onclick="closeMore()">';
  html += '<div style="background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:10px 16px 16px;" onclick="event.stopPropagation()">';
  html += '<div style="width:36px;height:4px;background:var(--border);border-radius:2px;margin:6px auto 12px;"></div>';
  items.forEach(function (it) {
    var active = ui.tab === it[0];
    html += '<button onclick="setTab(\'' + it[0] + '\')" style="display:block;width:100%;text-align:left;background:transparent;padding:14px 8px;font-size:14px;color:' + (active ? "var(--gold)" : "var(--text)") + ';font-weight:' + (active ? "600" : "400") + ';border-bottom:1px solid var(--border);">' + it[1] + '</button>';
  });
  html += '</div></div>';
  return html;
}
function toggleMore() { ui.moreOpen = !ui.moreOpen; render(); }
function closeMore() { ui.moreOpen = false; render(); }

function setTab(t) { ui.tab = t; ui.modal = null; ui.moreOpen = false; render(); }

function computeCategoryBreakdown(monthKeyStr) {
  var monthExpTx = data.transactions.filter(function (t) { return monthKey(t.date) === monthKeyStr && t.type === "expense"; });
  var spendByCat = {};
  monthExpTx.forEach(function (t) { spendByCat[t.category] = (spendByCat[t.category] || 0) + t.amount; });
  var catEntries = Object.keys(spendByCat).map(function (k) { return [k, spendByCat[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
  var totalSpend = catEntries.reduce(function (s, e) { return s + e[1]; }, 0);
  var gradParts = []; var acc0 = 0;
  catEntries.forEach(function (e) {
    var pct = totalSpend ? (e[1] / totalSpend) * 100 : 0;
    gradParts.push(categoryColor(e[0]) + " " + acc0 + "% " + (acc0 + pct) + "%");
    acc0 += pct;
  });
  var donutBg = gradParts.length ? "conic-gradient(" + gradParts.join(", ") + ")" : "var(--border)";
  return { catEntries: catEntries, totalSpend: totalSpend, donutBg: donutBg };
}
function renderDonutCard(monthKeyStr, limit) {
  var b = computeCategoryBreakdown(monthKeyStr);
  var html = '';
  if (b.totalSpend === 0) {
    html += '<div class="empty">No expenses logged for this month. Add one to see the breakdown.</div>';
  } else {
    html += '<div style="display:flex;align-items:center;gap:18px;margin-top:12px;">';
    html += '<div style="width:110px;height:110px;border-radius:50%;background:' + b.donutBg + ';flex-shrink:0;position:relative;">';
    html += '<div style="position:absolute;inset:15px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;color:var(--muted);text-align:center;">' + fmt(b.totalSpend) + '</div></div>';
    html += '<div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;">';
    b.catEntries.slice(0, limit || 5).forEach(function (e) {
      var pct = b.totalSpend ? Math.round((e[1] / b.totalSpend) * 100) : 0;
      html += '<div style="display:flex;align-items:center;justify-content:space-between;font-size:13px;">';
      html += '<span style="display:flex;align-items:center;gap:6px;color:var(--text);"><span style="width:8px;height:8px;border-radius:50%;background:' + categoryColor(e[0]) + ';display:inline-block;"></span>' + esc(e[0]) + '</span>';
      html += '<span style="font-family:var(--font-mono);color:var(--muted);">' + fmt(e[1]) + ' \u00B7 ' + pct + '%</span></div>';
    });
    html += '</div></div>';
  }
  return html;
}

// ---------------- analytics ----------------
function renderAnalytics() {
  var transactions = data.transactions;
  var availableMonths = Array.from(new Set(transactions.map(function (t) { return monthKey(t.date); }).concat([monthKey(new Date())])))
    .sort(function (a, b) {
      var ap = a.split("-").map(Number), bp = b.split("-").map(Number);
      return bp[0] - ap[0] || bp[1] - ap[1];
    });
  function monthLabel(key) { var p = key.split("-").map(Number); return new Date(p[0], p[1], 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); }
  var mk = ui.dashboardMonth;
  var b = computeCategoryBreakdown(mk);

  var p = mk.split("-").map(Number);
  var prevDate = new Date(p[0], p[1] - 1, 1);
  var prevKey = monthKey(prevDate);
  var prevSpend = computeCategoryBreakdown(prevKey).totalSpend;
  var change = prevSpend ? ((b.totalSpend - prevSpend) / prevSpend) * 100 : null;

  var daysInMonth = new Date(p[0], p[1] + 1, 0).getDate();
  var avgDaily = b.totalSpend / daysInMonth;

  var html = '<div style="display:flex;flex-direction:column;gap:16px;">';
  html += '<div class="card">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">';
  html += '<div class="label">Category breakdown</div>';
  html += '<select onchange="setDashboardMonth(this.value)" style="padding:5px 8px;font-size:12px;">';
  availableMonths.forEach(function (k) { html += '<option value="' + k + '"' + (k === mk ? " selected" : "") + '>' + monthLabel(k) + '</option>'; });
  html += '</select></div>';
  html += renderDonutCard(mk, 20);
  html += '</div>';

  html += '<div style="display:flex;gap:16px;flex-wrap:wrap;">';
  html += '<div class="card" style="flex:1 1 150px;"><div class="label">Avg. daily spend</div><div style="font-family:var(--font-mono);font-size:20px;margin-top:8px;">' + fmt(avgDaily) + '</div></div>';
  html += '<div class="card" style="flex:1 1 150px;"><div class="label">vs last month</div><div style="font-family:var(--font-mono);font-size:20px;margin-top:8px;color:' + (change === null ? "var(--muted)" : change > 0 ? "var(--expense)" : "var(--income)") + ';">' + (change === null ? "\u2014" : (change > 0 ? "+" : "") + change.toFixed(1) + "%") + '</div></div>';
  html += '</div></div>';
  return html;
}

// ---------------- reports ----------------
function renderReports() {
  var mk = monthKey(new Date());
  var monthTx = data.transactions.filter(function (t) { return monthKey(t.date) === mk; });
  var income = monthTx.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var expense = monthTx.filter(function (t) { return t.type === "expense"; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var net = income - expense;
  var monthLabel = new Date().toLocaleDateString(undefined, { month: "long", year: "numeric" });

  var html = '<div style="display:flex;flex-direction:column;gap:16px;">';
  html += '<div class="card" style="text-align:center;">';
  html += '<div class="label">' + esc(monthLabel).toUpperCase() + ' \u00B7 NET SAVINGS</div>';
  html += '<div style="font-family:var(--font-mono);font-size:28px;margin-top:8px;color:' + (net >= 0 ? "var(--income)" : "var(--expense)") + ';">' + fmt(net) + '</div></div>';

  html += '<div style="display:flex;gap:16px;flex-wrap:wrap;">';
  html += '<div class="card" style="flex:1 1 150px;"><div class="label">Total income</div><div style="font-family:var(--font-mono);font-size:18px;margin-top:8px;color:var(--income);">' + fmt(income) + '</div></div>';
  html += '<div class="card" style="flex:1 1 150px;"><div class="label">Total expense</div><div style="font-family:var(--font-mono);font-size:18px;margin-top:8px;color:var(--expense);">' + fmt(expense) + '</div></div>';
  html += '</div>';

  html += '<div class="card"><div class="label">Export</div>';
  html += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">';
  html += '<button onclick="exportCSV()" class="btn-ghost" style="padding:8px 14px;font-size:13px;">Export transactions as CSV</button>';
  html += '<button onclick="importCSV()" class="btn-ghost" style="padding:8px 14px;font-size:13px;">Import transactions from CSV</button>';
  html += '</div><div class="sub" style="margin-top:8px;color:var(--muted);font-size:12px;">PDF export isn\'t available yet \u2014 CSV opens fine in Excel/Sheets.</div></div>';
  html += '</div>';
  return html;
}

// ---------------- recurring ----------------
function renderRecurring() {
  var html = '<div style="display:flex;flex-direction:column;gap:16px;">';
  html += '<div class="card"><div class="label">Recurring transactions</div>';
  html += '<div class="sub" style="margin-top:6px;color:var(--muted);font-size:12px;">Turn on "Repeat this entry" when adding a transaction to create one.</div>';
  var recurring = data.recurringTemplates || [];
  if (!recurring.length) {
    html += '<div class="empty" style="margin-top:12px;">No recurring entries yet.</div>';
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">';
    recurring.forEach(function (r, i) {
      var racc = data.accounts.filter(function (a) { return a.id === r.accountId; })[0];
      var color = r.type === "income" ? "var(--income)" : r.type === "expense" ? "var(--expense)" : "var(--transfer)";
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:8px;">';
      html += '<div><div style="font-size:13px;color:var(--text);">' + esc(r.category) + '</div>';
      html += '<div style="font-size:11px;color:var(--muted);margin-top:3px;">' + esc(racc ? racc.name : "") + ' \u00B7 ' + esc(r.frequency) + ' \u00B7 next: ' + esc(r.nextDueDate) + '</div></div>';
      html += '<div style="display:flex;align-items:center;gap:10px;"><span style="font-family:var(--font-mono);color:' + color + ';">' + fmt(r.amount) + '</span><button class="btn-ghost" onclick="deleteRecurring(' + i + ')">Del</button></div></div>';
    });
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderDashboard() {
  var netWorth = data.accounts.reduce(function (s, a) { return s + balanceOf(a.id); }, 0);
  var now = new Date();
  var thisMonthKey = now.getFullYear() + "-" + now.getMonth();
  var monthTx = data.transactions.filter(function (t) { return monthKey(t.date) === thisMonthKey; });
  var monthIncome = monthTx.filter(function (t) { return t.type === "income"; }).reduce(function (s, t) { return s + t.amount; }, 0);
  var monthExpense = monthTx.filter(function (t) { return t.type === "expense"; }).reduce(function (s, t) { return s + t.amount; }, 0);

  var greetHour = now.getHours();
  var greeting = greetHour < 12 ? "Good morning" : greetHour < 17 ? "Good afternoon" : "Good evening";

  var html = '<div style="padding:20px 20px 8px;">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
  html += '<div><div style="font-size:11px;color:var(--muted);">' + greeting + '</div><div style="font-size:21px;font-weight:700;margin-top:2px;">Overview</div></div>';

// ---------------- budgets computation ----------------
function computeBudgetsWithProgress() {
  var now = new Date();
  var thisMonthKey = now.getFullYear() + "-" + now.getMonth();
  var monthTx = data.transactions.filter(function (t) { return monthKey(t.date) === thisMonthKey; });
  var spendByCategory = {};
  monthTx.filter(function (t) { return t.type === "expense"; }).forEach(function (t) { spendByCategory[t.category] = (spendByCategory[t.category] || 0) + t.amount; });

  return data.budgets.map(function (b) {
    var spent = spendByCategory[b.category] || 0;
    var rolloverAmount = 0;
    if (b.rollover) {
      var prevDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      var prevKey = prevDate.getFullYear() + "-" + prevDate.getMonth();
      var prevSpent = data.transactions.filter(function (t) { return t.type === "expense" && t.category === b.category && monthKey(t.date) === prevKey; }).reduce(function (s, t) { return s + t.amount; }, 0);
      rolloverAmount = Math.max(0, b.limit - prevSpent);
    }
    var effectiveLimit = b.limit + rolloverAmount;
    return Object.assign({}, b, { spent: spent, rolloverAmount: rolloverAmount, effectiveLimit: effectiveLimit, pct: effectiveLimit ? Math.min(100, (spent / effectiveLimit) * 100) : 0 });
  });
}

var _renderTimer = null;
function scheduleRender(delay) { if (_renderTimer) clearTimeout(_renderTimer); _renderTimer = setTimeout(function () { _renderTimer = null; render(); }, delay || 200); }
function setFilter(key, val, immediate) { ui.txFilter[key] = val; if (immediate) { if (_renderTimer) { clearTimeout(_renderTimer); _renderTimer = null; } render(); } else { scheduleRender(200); } }

function getFilteredTx() {
  var now = new Date();
  function inDateRange(t) {
    if (ui.txFilter.range === "all" || !ui.txFilter.range) return true;
    var d = new Date(t.date);
    if (ui.txFilter.range === "week") {
      var start = new Date(now); start.setDate(now.getDate() - now.getDay()); start.setHours(0, 0, 0, 0);
      return d >= start;
    }
    if (ui.txFilter.range === "month") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    if (ui.txFilter.range === "custom") {
      if (ui.txFilter.from && d < new Date(ui.txFilter.from)) return false;
      if (ui.txFilter.to && d > new Date(ui.txFilter.to + "T23:59:59")) return false;
      return true;
    }
    return true;
  }
  return data.transactions.filter(function (t) { return ui.txFilter.type === "all" || t.type === ui.txFilter.type; })
    .filter(function (t) { return ui.txFilter.account === "all" || t.accountId === ui.txFilter.account || t.toAccountId === ui.txFilter.account; })
    .filter(inDateRange)
    .filter(function (t) {
      if (!ui.txFilter.search) return true;
      var s = ui.txFilter.search.toLowerCase();
      return (t.note || "").toLowerCase().indexOf(s) !== -1 || (t.category || "").toLowerCase().indexOf(s) !== -1;
    })
    .sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
}

function buildTransactionsCSV() {
  function accName(id) { var a = data.accounts.filter(function (x) { return x.id === id; })[0]; return a ? a.name : ""; }
  var header = ["Date", "Type", "Category", "Account", "To account", "Amount", "Note"];

    return [t.date ? t.date.slice(0, 10) : "", t.type, t.category || "", accName(t.accountId), t.toAccountId ? accName(t.toAccountId) : "", t.amount, t.note || ""];
  });

}
async function exportCSV() {

function importCSV() {
  var input = document.getElementById("import-file-input");

function parseCSV(text) {
  var rows = []; var i = 0, field = "", row = [], inQuotes = false;
  text = text.replace(/\r\n/g, "\n");
  while (i < text.length) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQuotes = false; i++; continue; }
      field += c; i++; continue;
    } else {
      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ",") { row.push(field); field = ""; i++; continue; }
      if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
      field += c; i++; continue;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function findOrCreateAccountId(name) {
  name = (name || "").trim();
  if (!name) name = "Imported";
  var existing = data.accounts.filter(function (a) { return a.name.toLowerCase() === name.toLowerCase(); })[0];
  if (existing) return existing.id;
  var acc = { id: uid(), name: name, type: ACCOUNT_TYPES[0], initialBalance: 0 };
  data.accounts.push(acc);
  return acc.id;
}
function handleImportedCSV(text) {
  var rows = parseCSV(text);
  if (!rows.length) { alert("The file is empty."); return; }
  var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
  var idx = {
    date: header.indexOf("date"), type: header.indexOf("type"), category: header.indexOf("category"),
    account: header.indexOf("account"), toAccount: header.indexOf("to account"),
    amount: header.indexOf("amount"), note: header.indexOf("note"),
  };
  if (idx.date === -1 || idx.amount === -1 || idx.account === -1) {
    alert("This doesn't look like a valid export file \u2014 expected columns: Date, Type, Category, Account, To account, Amount, Note.");
    return;
  }
  var imported = [];
  for (var r = 1; r < rows.length; r++) {
    var row = rows[r];
    if (!row || row.every(function (f) { return f === ""; })) continue;
    var amt = parseFloat(row[idx.amount]);
    if (isNaN(amt)) continue;
    var type = (row[idx.type] || "expense").trim().toLowerCase();
    if (type !== "income" && type !== "expense" && type !== "transfer") type = "expense";
    var accId = findOrCreateAccountId(row[idx.account]);
    var toAccId = type === "transfer" && idx.toAccount !== -1 ? findOrCreateAccountId(row[idx.toAccount]) : undefined;
    imported.push({
      id: uid(), type: type, amount: amt,
      category: type === "transfer" ? "Transfer" : ((row[idx.category] || "Other").trim() || "Other"),
      accountId: accId, toAccountId: toAccId,
      date: (row[idx.date] || "").trim(), note: idx.note !== -1 ? (row[idx.note] || "") : "",
    });
  }
  if (!imported.length) { alert("No valid transactions found in that file."); return; }
  if (!confirm("Import " + imported.length + " transaction(s) from this file?")) return;
  var replace = confirm("Press OK to REPLACE all existing transactions with the imported ones.\nPress Cancel to instead ADD them to your existing transactions.");
  if (replace) { data.transactions = imported; } else { data.transactions = data.transactions.concat(imported); }
  saveData(); render();
  alert("Imported " + imported.length + " transaction(s) successfully.");
}
function addCustomCategory(kind, name) {

function addMonths(dateStr, n) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + n);
  var daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, daysInMonth));
  return d.toISOString().slice(0, 10);
}
function addWeeks(dateStr, n) { var d = new Date(dateStr + "T00:00:00"); d.setDate(d.getDate() + n * 7); return d.toISOString().slice(0, 10); }
function advanceDate(dateStr, freq) { return freq === "weekly" ? addWeeks(dateStr, 1) : addMonths(dateStr, 1); }

    var guard = 0;
    while (tpl.nextDueDate <= todayStr && guard < 60) {
      data.transactions.push({
        id: uid(), type: tpl.type, amount: tpl.amount, category: tpl.category,
        accountId: tpl.accountId, toAccountId: tpl.toAccountId, date: tpl.nextDueDate,
        note: tpl.note ? tpl.note : "Recurring",

  html += '<div>' + fieldLabel("Note (optional)") + '<input id="tx-note" value="' + esc(d.note) + '" oninput="setDraftField(\'note\', this.value)" placeholder="e.g. Groceries at the market" style="width:100%;"></div>';
  if (!m.editingId) {
    html += '<div><label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;"><input type="checkbox" ' + (d.makeRecurring ? "checked" : "") + ' onchange="setDraftField(\'makeRecurring\', this.checked, true)">Repeat this entry</label>';
    if (d.makeRecurring) {
      html += '<select onchange="setDraftField(\'recurringFrequency\', this.value, true)" style="width:100%;margin-top:8px;">';
      html += '<option value="weekly"' + (d.recurringFrequency === "weekly" ? " selected" : "") + '>Weekly</option>';
      html += '<option value="monthly"' + (d.recurringFrequency === "monthly" ? " selected" : "") + '>Monthly</option>';
      html += '</select>';
    }
    html += '</div>';
  }
  if (d.error) html += '<div style="color:var(--expense);font-size:12px;">' + esc(d.error) + '</div>';
  html += '<button type="submit" class="btn-gold" style="border:none;padding:10px 0;margin-top:4px;">' + (m.editingId ? "Save changes" : "Add entry") + '</button>';
  html += '</form>' + modalShellEnd();
  return html;
}

function renderAccountModal(m) {
  var d = m.draft;

  html += '<div>' + fieldLabel("Account name") + '<input id="acc-name" value="' + esc(d.name) + '" oninput="setDraftField(\'name\', this.value)" placeholder="e.g. HDFC savings" style="width:100%;"></div>';
  html += '<div>' + fieldLabel("Type") + '<select onchange="setDraftField(\'type\', this.value, true)" style="width:100%;">';

  html += '<div>' + fieldLabel("Starting balance") + '<input id="acc-bal" value="' + esc(d.initialBalance) + '" oninput="setDraftField(\'initialBalance\', this.value)" inputmode="decimal" style="width:100%;"></div>';

  return html;
}

function renderBudgetModal(m) {

  if (d.category === "__new__") html += '<input id="budget-newcat" value="' + esc(d.newCategoryName) + '" oninput="setDraftField(\'newCategoryName\', this.value)" placeholder="e.g. Pet care" style="width:100%;margin-top:8px;">';
  html += '</div>';
  html += '<div>' + fieldLabel("Monthly limit") + '<input id="budget-limit" value="' + esc(d.limit) + '" oninput="setDraftField(\'limit\', this.value)" inputmode="decimal" placeholder="0.00" style="width:100%;"></div>';
  html += '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;"><input type="checkbox" ' + (d.rollover ? "checked" : "") + ' onchange="setDraftField(\'rollover\', this.checked, true)">Carry unused budget into next month</label>';

  return html;
}
